<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Torkaman | Graphic Designer & Developer</title>
    <link rel="stylesheet" href="style.css">
    <!-- اضافه کردن فونت‌های گوگل (Montserrat + Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- کانتینر اصلی که کل صفحه را در بر می‌گیرد -->
    <div class="container">

        <!-- بخش هدر (عنوان پروژه‌ها در بالای صفحه - اختیاری) -->
        <header class="page-header">
            <h1>Portfolio</h1>
            <p class="subtitle">Selected Works</p>
        </header>

        <!-- گریدِ نمونه‌کارها (شبکه‌ی ۱:۱) -->
        <div class="portfolio-grid">
            
            <!-- نمونه کار ۱ -->
            <div class="project-card">
                <a href="#" target="_blank">
                    <div class="image-wrapper">
                        <img src="assets/images/saffron.jpg" alt="Resa Saffron Packaging">
                    </div>
                </a>
                <div class="project-info">
                    <h2>Resa Saffron</h2>
                    <p>Branding & Packaging</p>
                </div>
            </div>

            <!-- نمونه کار ۲ (برای بقیه پروژه‌ها همین رو کپی کنید) -->
            <div class="project-card">
                <a href="#">
                    <div class="image-wrapper">
                        <img src="assets/images/your-next-image.jpg" alt="Project Title">
                    </div>
                </a>
                <div class="project-info">
                    <h2>Project Title</h2>
                    <p>Category</p>
                </div>
            </div>

            <!-- شما می‌توانید این بخش را برای تمام پروژه‌ها تکرار کنید -->

        </div>

        <!-- فوتر (نام شما و اطلاعات تماس) -->
        <footer class="page-footer">
            <div class="brand">
                <span class="name">Ali Torkaman</span>
                <span class="role">Graphic Designer & Developer</span>
            </div>
            <div class="contact">
                <a href="mailto:your-email@example.com">Email</a>
                <a href="#">LinkedIn</a>
                <a href="#">GitHub</a>
            </div>
        </footer>

    </div>

</body>
</html>
